[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "Game-Deals"
version = "2.0.0"
dependencies = [
  "django~=5.2",
  "psycopg2-binary~=2.9",
  "dj-database-url~=2.3",
  "celery~=5.4",
  "redis~=5.2",
  "djangorestframework~=3.15",
]
requires-python = ">= 3.13"
readme = "README.md"

[project.optional-dependencies]
dev = [
  "dj-maker~=0.2.0",
  "hatch~=1.16.2",
]
