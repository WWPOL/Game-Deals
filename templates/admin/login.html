{% extends 'admin/login.html' %}

{% load i18n socialaccount %}

{% block login_before %}
    <a href="{% provider_login_url 'google' %}"
       class="flex items-center justify-center w-full px-4 py-3 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 dark:bg-gray-800 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-700 transition-colors">
        {% trans "Sign in with Google" %}
    </a>

    <div class="relative flex items-center justify-center my-6">
        <div class="flex-grow border-t border-gray-300 dark:border-gray-600"></div>
        <span class="flex-shrink mx-4 text-sm text-gray-500 dark:text-gray-400">{% trans "or" %}</span>
        <div class="flex-grow border-t border-gray-300 dark:border-gray-600"></div>
    </div>
{% endblock %}
