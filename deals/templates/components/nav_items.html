{% comment %}
  Navigation items component - used in both desktop nav and mobile hamburger menu

  Parameters:
  - mobile: Boolean, if true applies mobile-specific styling (optional, default false)
  {% endcomment %}

<!-- Admin Button -->
{% if user.is_authenticated %}
<a href="{% url 'admin:index' %}" class="{% if mobile %}block px-4 py-3{% else %}rounded-lg deal-bg-primary px-4 py-2{% endif %} deal-fg-primary font-semibold {% if not mobile %}deal-bg-primary{% endif %} hover:opacity-80 transition-opacity">
  Go to Console
</a>
{% endif %}

<!-- Browse Link -->
<a href="{% url 'deals:browse' %}" class="{% if mobile %}block px-4 py-3 text-base{% else %}text-sm{% endif %} font-medium deal-fg-primary hover:opacity-80 transition-opacity">
    Browse All
</a>
