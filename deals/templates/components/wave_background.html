{# Reusable wave background component - pass a list of color objects with background_color and weight #}
{% load deal_colors %}

<style>
    .wave-animation-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: hidden;
    }

    .wave-animation-container svg {
        position: absolute;
        width: 100%;
        height: 100%;
    }

    .wave-svg {
        filter: blur(20px);
        opacity: 0.8;
    }

    .wave-path {
        transform-origin: center;
    }
</style>

<div class="wave-animation-container">
    <svg class="wave-svg" viewBox="-100 0 1200 1000" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    </svg>
</div>

<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
<script>
    // Collect all background colors from the provided color list
    var allColors = [
        {% for color in colors %}
        {
            background: "{{ color.background_color }}",
            weight: {{ color.weight }}
        }{% if not forloop.last %},{% endif %}
        {% endfor %}
    ];

    // If no colors found, use default darker purplish palette
    if (allColors.length === 0) {
        var defaultColors = [
            '#1a0f2e', // Dark purple
            '#2d1b4e', // Deep purple
            '#1e1b3c', // Dark blue-purple
            '#251640', // Dark violet
            '#1c1333', // Very dark purple
            '#2a1f3d', // Dark plum
        ];

        allColors = defaultColors.map(function(color) {
            return {
                background: color,
                weight: 1
            };
        });
    }

    // Remove duplicates and combine weights
    var colorMap = {};
    allColors.forEach(function(color) {
        if (colorMap[color.background]) {
            colorMap[color.background] += color.weight;
        } else {
            colorMap[color.background] = color.weight;
        }
    });

    // Convert back to array
    var uniqueColors = Object.keys(colorMap).map(function(bg) {
        return { background: bg, weight: colorMap[bg] };
    });

    // Normalize weights
    var totalWeight = uniqueColors.reduce(function(sum, c) { return sum + c.weight; }, 0);
    uniqueColors.forEach(function(c) { c.weight = c.weight / totalWeight; });

    var svg = document.querySelector('.wave-svg');

    // Helper function to create wave path
    function createWavePath(yPosition, amplitude, frequency, phase) {
        var path = 'M -200,' + yPosition;

        for (var x = -200; x <= 1200; x += 10) {
            var y = yPosition + Math.sin((x + phase) * frequency) * amplitude;
            path += ' L ' + x + ',' + y;
        }

        // Close the path at the bottom
        path += ' L 1200,1200 L -200,1200 Z';
        return path;
    }

    // Create SVG waves
    var waves = [];
    var waveCount = Math.min(uniqueColors.length * 3, 20); // Create multiple waves per color

    for (var i = 0; i < waveCount; i++) {
        var colorIndex = i % uniqueColors.length;
        var colorEntry = uniqueColors[colorIndex];

        // Distribute waves across the viewport
        var yPosition = (i / waveCount) * 1200 - 100;
        var amplitude = 40 + Math.random() * 60;
        var frequency = 0.003 + Math.random() * 0.005;
        var phase = Math.random() * 1000;

        var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('class', 'wave-path');
        path.setAttribute('d', createWavePath(yPosition, amplitude, frequency, phase));
        path.setAttribute('fill', colorEntry.background);
        path.setAttribute('opacity', 0.3 + Math.random() * 0.4);
        svg.appendChild(path);

        waves.push({
            element: path,
            yPosition: yPosition,
            amplitude: amplitude,
            frequency: frequency,
            phase: phase
        });
    }

    // Animate waves with smooth continuous animation
    function animateWave(wave, index) {
        var direction = index % 2 === 0 ? 1 : -1;
        var phaseSpeed = 15000 + Math.random() * 20000;
        var verticalSpeed = 25000 + Math.random() * 15000;

        var baseYPosition = wave.yPosition;
        var startTime = Date.now() + (index * 500); // Stagger start times

        function updateWave() {
            var elapsed = Date.now() - startTime;

            // Continuous phase animation (horizontal flow)
            wave.phase = wave.phase + (direction * 0.5);

            // Smooth vertical oscillation using sine wave
            var verticalOffset = Math.sin(elapsed / verticalSpeed * Math.PI * 2) * 50 * direction;
            wave.yPosition = baseYPosition + verticalOffset;

            wave.element.setAttribute('d', createWavePath(
                wave.yPosition,
                wave.amplitude,
                wave.frequency,
                wave.phase
            ));

            requestAnimationFrame(updateWave);
        }

        updateWave();
    }

    waves.forEach(function(wave, index) {
        animateWave(wave, index);
    });
</script>
