{# Reusable blob background component - pass a list of color objects with background_color, foreground_color, and weight #}
{% load deal_colors %}

<style>
    .animation-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: hidden;
    }

    .animation-container svg {
        position: absolute;
        width: 100%;
        height: 100%;
    }

    .blob-svg {
        filter: blur(60px);
        opacity: 0.8;
    }
</style>

<div class="animation-container deal-gradient-bg">
    <svg class="blob-svg" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
    </svg>
</div>

<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
<script>
    var paletteColors = [
        {% for color in colors %}
        {
            background: "{{ color.background_color }}",
            foreground: "{{ color.foreground_color }}",
            weight: {{ color.weight }}
        }{% if not forloop.last %},{% endif %}
        {% endfor %}
    ];
    var container = document.querySelector('.animation-container');
    var svg = container.querySelector('svg');

    // Helper function to create irregular blob shape
    function createBlobPath(cx, cy, size) {
        var points = 8;
        var path = 'M';
        for (var i = 0; i <= points; i++) {
            var angle = (i / points) * Math.PI * 2;
            var randomRadius = size * (0.7 + Math.random() * 0.6);
            var x = cx + Math.cos(angle) * randomRadius;
            var y = cy + Math.sin(angle) * randomRadius;

            if (i === 0) {
                path += x + ',' + y;
            } else {
                var prevAngle = ((i - 1) / points) * Math.PI * 2;
                var prevRadius = size * (0.7 + Math.random() * 0.6);
                var cpx = cx + Math.cos(prevAngle + 0.3) * prevRadius;
                var cpy = cy + Math.sin(prevAngle + 0.3) * prevRadius;
                path += ' Q' + cpx + ',' + cpy + ' ' + x + ',' + y;
            }
        }
        return path + 'Z';
    }

    // Create SVG blobs with weight-based sizing
    var blobs = [];

    paletteColors.forEach(function(colorEntry, index) {
        // Use weight to determine blob size and count - more blobs for better coverage
        var blobSize = 400 * (colorEntry.weight * 2.5);
        var blobCount = Math.max(2, Math.ceil(5 * colorEntry.weight));

        for (var i = 0; i < blobCount; i++) {
            // Random position across canvas
            var cx = Math.random() * 1000;
            var cy = Math.random() * 1000;

            var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('class', 'morphing-blob');
            path.setAttribute('d', createBlobPath(cx, cy, blobSize));
            path.setAttribute('fill', colorEntry.background);
            svg.appendChild(path);
            blobs.push({ element: path, baseCx: cx, baseCy: cy });
        }
    });

    // Animate morphing blobs with slow, gentle movement
    blobs.forEach(function(blob, index) {
        var offsetX = anime.random(-60, 60);
        var offsetY = anime.random(-60, 60);

        blob.element.style.transformOrigin = 'center';

        anime({
            targets: blob.element,
            translateX: [0, offsetX],
            translateY: [0, offsetY],
            easing: 'easeInOutQuad',
            duration: 25000,
            loop: true,
            direction: 'alternate',
            delay: index * 1500
        });
    });

    // Add decorative squiggly lines
    var numLines = 5;
    for (var i = 0; i < numLines; i++) {
        var line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        var startX = Math.random() * 1000;
        var startY = Math.random() * 1000;
        var linePath = 'M' + startX + ',' + startY;

        for (var j = 0; j < 4; j++) {
            var x = startX + (j + 1) * 80 + anime.random(-40, 40);
            var y = startY + anime.random(-100, 100);
            var cpx = startX + j * 80 + 40;
            var cpy = startY + anime.random(-60, 60);
            linePath += ' Q' + cpx + ',' + cpy + ' ' + x + ',' + y;
            startX = x;
            startY = y;
        }

        line.setAttribute('d', linePath);
        line.setAttribute('stroke', paletteColors[i % paletteColors.length]);
        line.setAttribute('stroke-width', anime.random(2, 5));
        line.setAttribute('fill', 'none');
        line.setAttribute('opacity', '0.4');
        line.setAttribute('class', 'decorative-line');
        svg.appendChild(line);

        anime({
            targets: line,
            strokeDashoffset: [anime.setDashoffset, 0],
            opacity: [0.2, 0.6],
            duration: 10000,
            easing: 'easeInOutSine',
            loop: true,
            direction: 'alternate',
            delay: i * 1000
        });
    }

    // Add geometric accent shapes
    var numShapes = 8;
    for (var i = 0; i < numShapes; i++) {
        var shape = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        var x = Math.random() * 1000;
        var y = Math.random() * 1000;
        var size = anime.random(20, 60);

        shape.setAttribute('x', x);
        shape.setAttribute('y', y);
        shape.setAttribute('width', size);
        shape.setAttribute('height', size / 3);
        shape.setAttribute('fill', paletteColors[i % paletteColors.length]);
        shape.setAttribute('opacity', '0.3');
        shape.setAttribute('rx', '5');
        svg.appendChild(shape);

        anime({
            targets: shape,
            rotate: anime.random(-45, 45),
            translateX: function() { return anime.random(-150, 150); },
            translateY: function() { return anime.random(-150, 150); },
            opacity: [0.2, 0.5],
            duration: 20000,
            easing: 'easeInOutSine',
            loop: true,
            direction: 'alternate',
            delay: i * 800
        });
    }
</script>
