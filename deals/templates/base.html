{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Game Deals{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/common.css' %}">
    <link rel="stylesheet" href="{% static 'css/deal-colors.css' %}">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .deal-card {
            animation: fadeIn 0.3s ease-out;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    {% block nav %}
    <nav class="deal-bg-primary-80 shadow-sm fixed top-0 left-0 right-0 z-10 deal-fg-primary backdrop-blur">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <a href="{% url 'deals:home' %}" class="flex items-center">
                        <span class="text-2xl font-bold deal-fg-primary">🎮 Game Deals</span>
                        <span class="ml-3 text-sm deal-fg-primary hidden sm:block">by Olly G</span>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="subscribe-btn" class="deal-bg-primary deal-fg-primary px-4 py-2 rounded-lg transition-all hover:shadow-lg deal-glow-sm deal-glow-md-hover font-semibold border-white-20">
                        Subscribe to Alerts
                    </button>
                </div>
            </div>
        </div>
    </nav>
    {% endblock %}

    <main class="pt-16">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t border-gray-200 mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="text-center">
                <p class="text-gray-900 font-semibold mb-2">🎮 Olly G's Game Deals</p>
                <p class="text-gray-600 text-sm">
                    Never miss a great deal on your favorite games
                </p>
                <p class="text-gray-500 text-xs mt-3">
                    No affiliate links • No ads • Always free
                </p>
            </div>
        </div>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
