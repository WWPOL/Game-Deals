apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: app
        image: ghcr.io/wwpol/game-deals:latest
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: django-secret
              key: DATABASE_URL
        - name: REDIS_URL
          value: redis://redis:6379/0
        - name: CELERY_BROKER_URL
          value: redis://redis:6379/0
        - name: TEMP_DOWNLOAD_DIR
          value: /tmp/game-deals
        volumeMounts:
        - name: temp-downloads
          mountPath: /tmp/game-deals
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: temp-downloads
        emptyDir:
          sizeLimit: 256Mi
