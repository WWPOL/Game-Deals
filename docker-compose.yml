services:
  postgres:
    image: postgres:18-alpine
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_DB: game_deals
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_18_data:/var/lib/postgresql/18/docker
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      dockerfile: dev.Dockerfile
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/game_deals

volumes:
  postgres_18_data: {}
